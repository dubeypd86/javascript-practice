<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    background-color: #111;
    overflow: hidden;
    cursor: crosshair;
}

.particle {
    position: absolute;
    width: 10px;
    height: 10px;

    background: #00ffff;
    border-radius: 50%;

    box-shadow: 0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #0088ff;

    pointer-events: none;

    animation: fade 0.8s linear forwards;
}

@keyframes fade {
    0% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(0);
    }
}
</style>
<body>

    <div id="particles"></div>

    <script src="script4.js"></script>
</body>
</html>
